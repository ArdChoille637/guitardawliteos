<text class="lbl" x="540" y="360">0.1uF cer</text>

<text class="rd" x="40" y="400">Notes — 9 V TL072 variant (vs the 5 V canonical sheet)</text>
<text class="lbl" x="40" y="418">U1 = TL072 (pin-compatible w/ MCP6002; DIP-8).  V+ pin 8 = +9 V from the Gator PSU</text>
<text class="lbl" x="40" y="434">via the CopperSound DC jack;  V− pin 4 = GND.</text>
<text class="lbl" x="40" y="456">VBIAS = 4.9 V (R1 10k / R2 12k from 9 V) — keeps the JFET inputs ≥ 4 V from ground</text>
<text class="lbl" x="40" y="472">(TL072 phase-reversal guard).</text>
<text class="lbl" x="40" y="494">Cout isolates the 9 V domain: the PCM1808 self-biases its input after the cap —</text>
<text class="lbl" x="40" y="510">the ADC never sees the 9 V rail.</text>
<text class="lbl" x="40" y="532">SPICE-verified (ngspice-46): DC 4.909 V · ×3.00 gain, flat 100 Hz–20 kHz · −3 dB @ 2.7 Hz.</text>
<text class="lbl" x="40" y="548">Hot humbucker 1 Vpp → 1.02–3.97 V at the ADC pin on a TYPICAL part (swing 1.5 V from rail).</text>
<text class="acc" x="40" y="570">Headroom is TYPICAL-part, not guaranteed: at the TL072 guaranteed-min swing (3 V from each</text>
<text class="acc" x="40" y="586">rail) the op-amp clips positive peaks at 6.00 V — i.e. −2.9 dBFS at the ADC — before the ADC's</text>
<text class="acc" x="40" y="602">own full scale. 9 V has no bias point that satisfies both output swing and the JFET CM floor.</text>
<text class="acc" x="40" y="618">SET THE TRIM SO HARD STRUMS PEAK AT −6 dBFS. (2026-07-28 review; re-verified in ngspice.)</text>
</svg>
