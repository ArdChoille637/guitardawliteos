<svg width="100%" viewBox="0 0 680 636" role="img" xmlns="http://www.w3.org/2000/svg">
<title>GuitarDAWLiteOS TL072 front-end schematic (single 9 V, CopperSound bench build)</title>
<desc>Single 9V guitar front-end: CopperSound input jack, 0.1uF coupling, 1M bias to a 4.9V mid-rail, TL072 buffer, x3 gain stage with trim, 1uF output coupling to the output jack; 1k+1nF anti-alias lands at the ADC LIN pad. SPICE-verified.</desc>
