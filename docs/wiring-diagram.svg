<svg width="100%" viewBox="0 0 680 700" role="img" xmlns="http://www.w3.org/2000/svg">
<title>GuitarDAWLiteOS Pi 5 I2S wiring diagram</title>
<desc>Raspberry Pi 5 as I2S0 master driving a PCM1808 ADC (with a guitar analog front-end) and a PCM5102A DAC, showing clocks, audio data, strapping, and the power tree.</desc>
<style>
text{font-family:-apple-system,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}
.box{fill:#F1EFE8;stroke:#888780;stroke-width:1}
.gray{fill:#F1EFE8;stroke:#5F5E5A}.teal{fill:#E1F5EE;stroke:#0F6E56}.coral{fill:#FAECE7;stroke:#993C1D}.purple{fill:#EEEDFE;stroke:#534AB7}
.gray text,.teal text,.coral text,.purple text{fill:#2C2C2A}
.gray .ts,.teal .ts,.coral .ts,.purple .ts{fill:#444441}
rect[class]{stroke-width:1}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="40" y1="44" x2="58" y2="44" stroke="#378ADD" stroke-width="2.5"/>
<text class="ts" x="62" y="48">clock (MCLK / BCLK / LRCLK)</text>
<line x1="250" y1="44" x2="268" y2="44" stroke="#D4537E" stroke-width="2.5"/>
<text class="ts" x="272" y="48">audio data (I2S)</text>
<text class="ts" x="392" y="48">power: see boxes and tree below</text>

<g class="gray"><rect x="40" y="70" width="600" height="92" rx="6"/></g>
<text class="th" x="54" y="94">Raspberry Pi 5 - I2S0 master on 40-pin header (J8)</text>
<text class="ts" x="54" y="118">p7 GPIO4 = MCLK 12.288 MHz  .  p12 GPIO18 = BCLK  .  p35 GPIO19 = LRCLK</text>
<text class="ts" x="54" y="138">p38 GPIO20 = DOUT capture-in  .  p40 GPIO21 = DIN playback-out  .  p2 5V . p1 3V3 . p6 GND</text>

<line x1="190" y1="162" x2="190" y2="226" stroke="#378ADD" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="184" y="198" text-anchor="end">MCLK BCLK LRCLK</text>
<line x1="250" y1="226" x2="250" y2="164" stroke="#D4537E" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="256" y="198">DOUT capture</text>
<line x1="460" y1="162" x2="460" y2="226" stroke="#378ADD" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="454" y="198" text-anchor="end">BCLK LRCLK</text>
<line x1="530" y1="162" x2="530" y2="226" stroke="#D4537E" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="536" y="198">DIN playback</text>

<g class="teal"><rect x="120" y="228" width="200" height="150" rx="6"/></g>
<text class="th" x="132" y="251">PCM1808 ADC . capture</text>
<text class="ts" x="132" y="273">VCC 5V . VDD 3.3V<tspan x="132" dy="16">MD0, MD1, FMT -&gt; GND</tspan><tspan x="132" dy="16">slave . I2S 24-bit</tspan><tspan x="132" dy="16">SCKI&lt;-MCLK . BCK&lt;-BCLK</tspan><tspan x="132" dy="16">LRCK&lt;-LRCLK . DOUT-&gt;p38</tspan><tspan x="132" dy="16">VINL &lt;- front-end</tspan></text>

<g class="coral"><rect x="400" y="228" width="200" height="150" rx="6"/></g>
<text class="th" x="412" y="251">PCM5102A DAC . play</text>
<text class="ts" x="412" y="273">VIN 5V (onboard LDO)<tspan x="412" dy="16">SCK -&gt; GND (int. PLL)</tspan><tspan x="412" dy="16">FLT=L . DEMP=L . FMT=L</tspan><tspan x="412" dy="16">XSMT=H - unmute!</tspan><tspan x="412" dy="16">BCK&lt;-BCLK . LCK&lt;-LRCLK</tspan><tspan x="412" dy="16">DIN &lt;- p40</tspan></text>

<line x1="170" y1="430" x2="170" y2="382" stroke="#7F77DD" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="176" y="410">VINL</text>
<line x1="500" y1="380" x2="500" y2="428" stroke="#888780" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="506" y="408">line out</text>

<text class="ts" x="50" y="424">Guitar 1/4 in -&gt;</text>
<g class="purple"><rect x="40" y="430" width="250" height="128" rx="6"/></g>
<text class="th" x="52" y="453">Guitar front-end . 5 V rail</text>
<text class="ts" x="52" y="475">1/4in -&gt; 0.1uF -&gt; 1M @ VREF<tspan x="52" dy="16">buffer -&gt; gain x3 (trim x2-10)</tspan><tspan x="52" dy="16">-&gt; 1uF -&gt; 1k+1nF -&gt; VINL</tspan><tspan x="52" dy="16">op-amp OPA1662 / OPA2353</tspan></text>

<g class="gray"><rect x="400" y="430" width="200" height="92" rx="6"/></g>
<text class="th" x="412" y="453">Line out -&gt; amp</text>
<text class="ts" x="412" y="475">2.1 Vrms . 3.5 mm / L-R-G<tspan x="412" dy="16">ground-centered (no DC caps)</tspan></text>

<rect class="box" x="40" y="588" width="600" height="86" rx="6"/>
<text class="th" x="54" y="612">Power tree</text>
<text class="ts" x="54" y="634">header 5V (p2) -&gt; ferrite -&gt; analog 5V -&gt; PCM1808 VCC + op-amp (5V)  ;  -&gt; PCM5102A VIN</text>
<text class="ts" x="54" y="654">local LDO -&gt; 3.3V -&gt; PCM1808 VDD  ;  single-point star ground (AGND = DGND)</text>
</svg>
